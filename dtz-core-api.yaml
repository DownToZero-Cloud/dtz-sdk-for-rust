openapi: 3.1.0
info:
  title: DTZ Core Api
  version: 2.3.7
  description: a generated client for the DTZ Core API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Jens Walter
    email: jens@apimeister.com
servers:
- url: https://dtz.rocks/api/2021-12-09
paths:
  /context:
    get:
      summary: get current context
      description: get current context
      operationId: getCurrentContext
      responses:
        "200":
          description: status
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/ContextResponse'
        "404":
          description: context not found
        "503":
          description: context could not be read from storage, try again
    post:
      summary: create new context
      description: create new context
      operationId: createContext
      x-openai-isConsequential: true
      requestBody: 
        description: create a new context
        content: 
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
      responses:
        "200":
          description: status
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/ContextResponse'
  /context/{context_id}:
    get:
      summary: get context information
      operationId: getContext
      parameters:
        - in: path
          name: context_id
          schema:
            type: string
            format: ContextId
          required: true
          description: context id
      responses:
        "200":
          description: context information
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/ContextResponse'
        "404":
          description: context not found
        "503":
          description: context could not be read from storage, try again
    post:
      summary: update context
      description: update context
      operationId: updateContext
      parameters:
        - in: path
          name: context_id
          schema:
            type: string
            format: ContextId
          required: true
          description: context id
      requestBody: 
        description: update context
        content: 
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
      responses:
        "200":
          description: status
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/ContextResponse'
        "503":
          description: context could not be read from storage, try again
    delete:
      summary: delete context
      operationId: deleteContext
      x-openai-isConsequential: true
      parameters:
        - in: path
          name: context_id
          schema:
            type: string
            format: ContextId
          required: true
          description: context id
      responses:
        "200":
          description: returns the deleted context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        "500":
          description: internal server error
  /chat:
    get:
      summary: list all chat threads for the current context
      operationId: listChat
      responses:
        "200":
          description: thread listing
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    id:
                      type: string
                      format: ChatId
                    lastUpdate:
                      type: string
                      format: date-time
        "503":
          description: chats could not be read from storage, try again
    post:
      summary: create a new chat by posting a message
      operationId: createChat
      requestBody:
        description: chat request request
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        "200":
          description: single response for the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseMessage'
        "503":
          description: chat could not be written to storage, try again
  /chat/{chat_id}:
    get:
      summary: get the full chat timeline
      operationId: getChat
      parameters:
        - in: path
          name: chat_id
          schema:
            type: string
            format: ChatId
          required: true
          description: chat id
          examples:
            chatId1:
              description: sample chat id
              value: chat-r3e2m4sa
      responses:
        "200":
          description: returns the full chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        "503":
          description: chat could not be read from storage, try again
    post:
      summary: add a new message to the chat
      operationId: updateChat
      parameters:
        - in: path
          name: chat_id
          schema:
            type: string
            format: ChatId
          required: true
          description: chat id
      requestBody:
        description: chat post
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        "200":
          description: single response for the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseMessage'
        "503":
          description: chat could not be read from or written to storage, try again
  /certificate:
    get:
      summary: list all stored certificates
      description: |
        lists every stored certificate of every host without its key material,
        together with the context whose ingress serves the host. only the
        infra context may call it. the call is also the pruning pass: a
        certificate that expired more than two days ago is removed from
        storage, and a host without certificates left is deleted
      operationId: listCertificates
      responses:
        "200":
          description: the stored certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateInfo'
        "401":
          description: the caller is no admin of its context
        "403":
          description: the caller is not the infra context
        "503":
          description: certificates could not be listed, try again
    post:
      summary: issue a certificate
      description: |
        issue a certificate - 
        if no certificate exists a new one is issued, if a certificate exists
        a new one will only be issued 3 days before its expiration
      operationId: issueCertificate
      requestBody: 
        description: issue a new certificate
        content: 
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
      responses:
        "200":
          description: issue certificate response
        "400":
          description: domain is not a host name
        "403":
          description: the domain is owned by another context, or it lies inside a zone of the platform (dtz.rocks, dtz.dev) and is not a host of the calling context
        "429":
          description: too many certificates already issued
        "503":
          description: stored certificate could not be read, try again
  /task:
    post:
      summary: pull one task from the async task queue
      operationId: pullTaskFromQueue
      x-dtz-all-responses: true
      requestBody:
        description: pulls the next task
        content: 
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: string
                  description: declares the node id
                instanceId:
                  type: string
                  description: declares the instance id
                cpuCapacity:
                  description: declares the cpu capacity of the node
                  type: integer
                  format: int64
                memCapacity:
                  description: declares the memory capacity of the node
                  type: integer
                  format: int64
                ecoMode:
                  description: declares if the node is running in eco mode
                  type: boolean
              required:
              - nodeId
              - cpuCapacity
              - memCapacity
              - ecoMode
      responses:
        "200":
          description: success
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/PullTaskResponse'
        "204":
          description: nothing found
  /task/{task_id}:
    post:
      summary: create task for async execution
      operationId: createTask
      parameters:
        - in: path
          name: task_id
          schema:
            type: string
            format: TaskId
          required: true
          description: task id
      requestBody:
        description: create a new task
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        "200":
          description: success
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
        "302":
          description: job already exists
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
    get:
      summary: get execution history
      operationId: getTaskHistory
      parameters:
        - in: path
          name: task_id
          schema:
            type: string
            format: TaskId
          required: true
          description: task id
      responses:
        "200":
          description: success
  /ingress:
    get:
      summary: list all ingress
      operationId: listIngress
      parameters:
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngressResponse'
        "503":
          description: ingress could not be read from storage, try again
  /ingress/{domain}/:
    get:
      summary: get ingress for '/' path
      operationId: getRootIngress
      parameters:
        - in: path
          name: domain
          schema:
            type: string
          required: true
          description: domain name
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      responses:
        "200":
          description: success
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/IngressResponse'
        "404":
          description: ingress not found
        "503":
          description: ingress could not be read from storage, try again
    post:
      summary: create or update ingress
      operationId: createRootIngress
      parameters:
        - in: path
          name: domain
          schema:
            type: string
          required: true
          description: domain name
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      requestBody:
        description: create or update ingress
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngressRequest'
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressResponse'
        "400":
          description: domain is not a host name, or its A and AAAA records are not the ones of dtz.rocks
        "403":
          description: domain is owned by another context, or it lies inside a zone of the platform (dtz.rocks, dtz.dev) and is not a host of the calling context
        "503":
          description: ingress could not be read from storage or the domain could not be resolved, try again
    delete:
      summary: delete ingress
      operationId: deleteRootIngress
      x-openai-isConsequential: true
      parameters:
        - in: path
          name: domain
          schema:
            type: string
          required: true
          description: domain name
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      responses:
        "200":
          description: status
        "403":
          description: domain is owned by another context
        "503":
          description: ingress could not be read from storage, try again
  /ingress/{domain}/{uri}:
    get:
      summary: get ingress for '/' path
      operationId: getIngress
      parameters:
        - in: path
          name: domain
          schema:
            type: string
          required: true
          description: domain name
        - in: path
          name: uri
          schema:
            type: string
          required: true
          description: uri
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      responses:
        "200":
          description: success
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/IngressResponse'
        "404":
          description: ingress not found
        "503":
          description: ingress could not be read from storage, try again
    post:
      summary: create static content for ingress
      operationId: createIngress
      parameters:
        - in: path
          name: domain
          schema:
            type: string
          required: true
          description: domain name
        - in: path
          name: uri
          schema:
            type: string
          required: true
          description: uri
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      requestBody:
        description: serve static content for ingress
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngressRequest'
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressResponse'
        "400":
          description: domain is not a host name, or its A and AAAA records are not the ones of dtz.rocks
        "403":
          description: domain is owned by another context, or it lies inside a zone of the platform (dtz.rocks, dtz.dev) and is not a host of the calling context
        "503":
          description: ingress could not be read from storage or the domain could not be resolved, try again
    delete:
      summary: delete ingress
      operationId: deleteIngress
      x-openai-isConsequential: true
      parameters:
        - in: path
          name: domain
          schema:
            type: string
          required: true
          description: domain name
        - in: path
          name: uri
          schema:
            type: string
          required: true
          description: uri
        - name: X-DTZ-REALM
          in: header
          description: see docs https://downtozero.cloud/docs e.g. dtz-objectstore, dtz-containerregistry, dtz-containers
          required: false
          schema:
            type: string  
          style: simple
      responses:
        "200":
          description: status
        "403":
          description: domain is owned by another context
        "503":
          description: ingress could not be read from storage, try again
  /identity/availableContexts:
    get:
      summary: list all avaiable contexts
      operationId: listAvailableContexts
      responses:
        "200":
          description: context listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextResponse'                    
  /containerregistry:
    post:
      summary: provision the container registry of the current context
      description: |
        creates the dns record, the ingress and the certificate for the
        container registry of the current context ({contextId}.cr.dtz.dev).
        the registry image is set by the core service. it is the shared platform
        image, which the nodes pull with the identity of the context.
      operationId: provisionContainerRegistry
      responses:
        "200":
          description: registry is provisioned
        "401":
          description: caller is not admin of the context
        "429":
          description: too many certificates already issued
        "503":
          description: ingress or certificate could not be created
    delete:
      summary: remove the container registry of the current context
      description: |
        deletes the ingress and the dns record of the container registry of
        the current context.
      operationId: deprovisionContainerRegistry
      x-openai-isConsequential: true
      responses:
        "200":
          description: registry is removed
        "401":
          description: caller is not admin of the context or of its container registry
  /containerregistry/credentials:
    post:
      summary: issue temporary storage credentials for the container registry of the current context
      description: |
        returns temporary credentials for the registry storage. they are valid
        for one hour and limited to the objects of the current context.
        only an admin of the context gets them.
      operationId: issueContainerRegistryStorageCredentials
      responses:
        "200":
          description: temporary storage credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageCredentials'
        "401":
          description: caller is not admin of the context
        "503":
          description: credentials could not be issued
components:
  schemas:
    CertificateInfo:
      type: object
      description: a stored certificate without its key material
      properties:
        host:
          type: string
        contextId:
          type: string
          format: ContextId
          description: the context the certificate is stored for
        owner:
          type: string
          format: ContextId
          description: the context whose ingress serves the host; absent when the host has no ingress. a renewal has to be requested by this context
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
      required:
        - host
        - contextId
        - validFrom
        - validTo
    StorageCredentials:
      type: object
      properties:
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        sessionToken:
          type: string
        expiration:
          type: string
          format: date-time
      required:
        - accessKeyId
        - secretAccessKey
        - sessionToken
        - expiration
    PullTaskResponse:
      type: object
      properties:
        contextId:
          type: string
          format: ContextId
        executionId:
          type: string
          format: ExecutionId
        taskId:
          type: string
          format: TaskId
        taskName:
          type: string
        containerImage:
          type: string
        containerPullUser:
          type: string
        containerPullPwd:
          type: string
          description: write-only, accepted on create and never returned
        envVariables:
          $ref: '#/components/schemas/EnvironmentVariables'
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMount'
        sourceId:
          description: source artifact that this ingress is attached to
          type: string
        accessToken:
          type: string
          description: the workload token of the task's context for the hour of the job, attached when the puller holds the task/pull scope of the infra context
        databaseToken:
          type: string
          description: the token of the job's database identity, when the task names one
        secrets:
          type: object
          description: the job's parameters, served to the container by the runner, never put into its environment
          additionalProperties:
            type: string
      required:
      - contextId
      - executionId
      - taskId
      - taskName
      - containerImage
    ContextResponse:
      type: object
      properties:
        contextId:
          type: string
          format: ContextId
        owner:
          type: string
          format: IdentityId
        created:
          type: string
          format: date-time
        alias:
          type: string
      required:
      - contextId
      - owner
      - created
    CreateIngressRequest: 
      type: object
      properties:
        validity:
          $ref: '#/components/schemas/Validity'
        login:
          $ref: '#/components/schemas/Login'
        rewrite:
          $ref: '#/components/schemas/Rewrite'
        container:
          $ref: '#/components/schemas/Container'
        staticContent:
          $ref: '#/components/schemas/StaticContent'
        singletonProcessor:
          type: boolean
        sourceId:
          description: source artifact that this ingress is attached to
          type: string
    Login:
      type: object
      properties:
        providerName:
          type: string
      required:
      - providerName
    Validity:
      type: object
      properties:
        validFrom:
          description: if not present, ingress is immediately available
          type: string
          format: date-time
        validTo:
          description: if not present, ingress is available forwever
          type: string
          format: date-time
    Rewrite:
      type: object
      properties:
        source:
          description: URI source as Regex (re2 syntax)
          type: string
        target:
          description: replacement string
          type: string
      required:
        - source
        - target
    IngressResponse:
      type: object
      properties:
        domain:
          type: string
        pathPrefix:
          type: string
        realm:
          description: owning realm, changes can only be performed within the realm 
          type: string
        validity:
          $ref: '#/components/schemas/Validity'
        login:
          $ref: '#/components/schemas/Login'
        rewrite:
          $ref: '#/components/schemas/Rewrite'
        container:
          $ref: '#/components/schemas/Container'
        staticContent:
          $ref: '#/components/schemas/StaticContent'
        singletonProcessor:
          type: boolean
        sourceId:
          description: source artifact that this ingress is attached to
          type: string
      required:
      - domain
      - pathPrefix
    StaticContent:
      type: object
      properties:
        http:
          type: object
          properties:
            header:
              type: array
              items:
                type: object
                properties:
                  name: 
                    type: string
                  value:
                    type: string
            content:
              description: base64 encoded content
              type: string
              format: byte
          required:
          - content
        https:
          type: object
          properties:
            header:
              type: array
              items:
                type: object
                properties:
                  name: 
                    type: string
                  value:
                    type: string
            content:
              description: base64 encoded content
              type: string
              format: byte
          required:
          - content
    Container:
      type: object
      properties:
        containerImage:
          type: string
        containerPort:
          type: integer
          format: int32
        containerIdentity:
          type: string
        containerPullUser:
          type: string
        containerPullPwd:
          type: string
          description: write-only, accepted on create and never returned
        envVariables:
          $ref: '#/components/schemas/EnvironmentVariables'
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMount'
        identityTokenInEnv:
          type: boolean
          default: true
          description: whether the container receives the workload token of its context as DTZ_ACCESS_TOKEN at start. a container that reads the token from the credential service of its node sets this to false and is no longer replaced before that token expires
      required:
      - containerImage
    Chat:
      type: object
      properties:
        chatId:
          type: string
          format: ChatId
        created:
          type: string
          format: date-time
        owner:
          type: string
          format: IdentityId
        privileges:
          type: object
          properties:
            allContextMembers:
              type: boolean
            nullBotRead:
              type: boolean
            nullBotWrite:
              type: boolean
            supportEmployee:
              type: boolean
        timeline:
          type: array
          items:
            type: object
            properties:
              created:
                type: string
                format: date-time
              content:
                type: string
              identityId:
                type: string
                format: IdentityId
    ChatResponseMessage:
      type: object
      properties:
        chatId:
          type: string
          format: ChatId
        created:
          description: when the message was created
          type: string
          format: date-time
        content:
          type: string
        identityId:
          type: string
          format: IdentityId
          description: who the answer is from
    EnvironmentVariables:
      type: object
      additionalProperties:
        oneOf:
        - type: string
        - $ref: '#/components/schemas/EncryptedValue'
    EncryptedValue:
      type: object
      properties:
        encryptionKey:
          type: string
          description: "Encryption algorithm or key reference, e.g. 'AES256:KEY1'."
        encryptedValue:
          type: string
          description: "The base-64 encoded ciphertext."
    CreateTaskRequest:
      type: object
      properties:
        taskName:
          type: string
        service:
          description: origin service, like dtz-flows, dtz-containers
          type: string
        earliestStart:
          type: string
          format: date-time
        latestStart:
          type: string
          format: date-time
        requireEcoMode:
          type: boolean
        taskDefinition:
          type: object
          properties:
            containerImage:
              type: string
            containerPullUser:
              type: string
            containerPullPwd:
              type: string
              description: write-only, accepted on create and never returned
            envVariables:
              $ref: '#/components/schemas/EnvironmentVariables'
            mounts:
              type: array
              items:
                $ref: '#/components/schemas/VolumeMount'
          required:
          - containerImage
        sourceId:
          description: source artifact that this ingress is attached to
          type: string
      required:
      - taskName
      - service
      - earliestStart
      - latestStart
      - requireEcoMode
      - taskDefinition
    VolumeMount:
      type: object
      properties:
        source:
          description: name of the volume
          type: string
          format: VolumeId
          examples:
          - volume-abc123:
              value: volume-abc123
        target:
          description: target path inside the container
          type: string
          examples:
          - data-mount:
              value: /data
      required:
      - source
      - target
    CreateTaskResponse:
      type: object
      properties:
        taskId:
          type: string
          format: TaskId
        service:
          type: string
        executionId:
          type: string
          format: ExecutionId
      required:
        - taskId
        - service
        - executionId
  securitySchemes:
    dtz_oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.dtz.rocks/api/2021-02-21/oauth/authorize
          tokenUrl: https://identity.dtz.rocks/api/2021-02-21/oauth/token
          scopes:
            openid: general scope
    dtz_apikey:
      type: apiKey
      in: header
      name: X-API-KEY
    dtz-cookie:
      type: apiKey
      in: cookie
      name: dtz_auth
security:
  - dtz_oauth: []
  - dtz_apikey: []
  - dtz-cookie: []
